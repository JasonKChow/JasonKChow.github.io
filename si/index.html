<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Links</title>
  <meta name="description" content="Links" />
  <style>
    :root{--bg:#fff;--text:#0b1220;--muted:#6b7280;--btn:#111827}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
    .box{width:100%;max-width:520px}
    h1{margin:0 0 6px;font-size:20px}
    p.desc{margin:0 0 18px;color:var(--muted)}
    .links{display:flex;flex-direction:column;gap:10px}
    .link{display:block;padding:12px 14px;border-radius:10px;text-decoration:none;background:#f3f4f6;color:var(--text);font-weight:600;border:1px solid #e8e9ee}
    .link.blank{background:var(--btn);color:#fff;border:0}
    .hint{margin-top:14px;color:var(--muted);font-size:13px}
    pre{background:#0f1724;color:#e6eef8;padding:10px;border-radius:8px;overflow:auto;font-size:13px}
    @media (prefers-color-scheme:dark){:root{--bg:#071025;--text:#e6eef8;--muted:#93a6bf;--btn:#1f2937} .link{background:#07122a;border:1px solid rgba(255,255,255,0.04)} .link.blank{background:#1f2937}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="box">
      <h1>Links</h1>


      <div id="links" class="links" aria-live="polite">
        <!-- links will be rendered here -->
      </div>

      <noscript>
        <p style="color:var(--muted)">JavaScript is required to render the links. Example edit in the file:</p>
        <pre>const links = [{ text: 'GitHub', url: 'https://github.com' }, { text: 'Blog', url: 'https://example.com', blank: true }]</pre>
      </noscript>
    </div>
  </div>

  <script>
    /*
      EASY EDITS
      - To add/remove links, edit the `links` array below.
      - Each item: { text: 'Label', url: 'https://...', blank: true }
      - Save the file to update the page at /si
    */

    const links = [
      // Example entries — replace these with your targets
      { text: 'Targeting', url: 'https://sheng-shen.github.io/data/fitts/index.html', blank: true },
      { text: 'Scrolling', url: 'https://sheng-shen.github.io/data/fitts/scroll.html', blank: true }
    ];

    (function render(){
      const container = document.getElementById('links');
      container.innerHTML = '';
      links.forEach(l => {
        if(!l || !l.url || !l.text) return;
        const a = document.createElement('a');
        a.className = 'link' + (l.blank ? ' blank' : '');
        a.href = l.url;
        a.textContent = l.text;
        if(l.blank) a.target = '_blank';
        a.rel = 'noopener';
        container.appendChild(a);
      });
    })();
  </script>
</body>
</html>
